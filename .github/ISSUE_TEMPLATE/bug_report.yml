name: Bug report
description: 报告可以稳定复现的问题
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。请先确认问题仍能在最新 Release 中复现，并移除日志、截图中的认证内容和个人数据。
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 例如 v1.0.1
      placeholder: v1.0.1
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows 版本
      placeholder: Windows 11 24H2
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      description: 请给出从启动应用到问题出现的完整步骤。
      placeholder: |
        1. 打开……
        2. 选择……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 补充信息
      description: 可附已脱敏的日志或截图；请勿粘贴认证 JSON。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已确认问题可在最新 Release 中复现。
          required: true
        - label: 我已移除认证内容、账户信息和个人路径。
          required: true
